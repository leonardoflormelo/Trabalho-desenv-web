<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input list="plataformas" id="plataforma" name="plataforma" placeholder="plataforma">
    <datalist id="plataformas">
        <option value="Windows">
        <option value="Linux">
        <option value="MacOS">
    </datalist>
    <div>
        <label for="AuFood">Escolha seu animalzinho</label>
        <select name="AuFood" id="AuFood">
            <option value="Cachorro">Cachorro</option>
            <option value="Gato">Gato</option>
            <option value="Papagaio">Papagaio</option>
        </select>
    </div>
    <div>
        <label for="times">--Esolha seu time--</label>
        <select id="times">
            <optgroup label="Rio de Janeiro">
                <option>Flamengo</option>
                <option>Fluminense</option>
                <option>Vasco</option>
                <option>Botafogo</option>
            </optgroup>
            <optgroup label="São Paulo">
                <option>São Paulo</option>
                <option>Palmeiras</option>
                <option>Santos</option>
                <option>Corinthians</option>
            </optgroup>
        </select>
    </div>
</body>
</html>
